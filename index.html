<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22385A">
<title>บ้านของส้ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--ink:#3B2417;--paper:#FFF8EE;--som:#E9A35A;--som-deep:#C9772F;--teal:#2FA39E;--navy:#22385A;--mint:#E3F0E8;--heart:#E8566B;
  --font:"Mali","Leelawadee UI","Thonburi","Noto Sans Thai",sans-serif;--px:"Silkscreen","Mali",monospace;
  --edge:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font:500 18px/1.35 var(--font);overscroll-behavior:none;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{image-rendering:pixelated;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;margin:0;padding:0;touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top)}
/* pixel panels / buttons */
.btn{position:relative;min-height:56px;min-width:56px;margin:3px;padding:6px 16px;background:var(--som);font:700 20px/1.2 var(--font);color:var(--ink);
  box-shadow:var(--edge),3px 3px 0 3px rgba(0,0,0,.28);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active,.btn.press{transform:translateY(2px);box-shadow:var(--edge),1px 1px 0 3px rgba(0,0,0,.28)}
.btn.paper{background:var(--paper)}.btn.teal{background:var(--teal);color:#fff}.btn.wide{display:flex;width:calc(100% - 6px)}
.btn.big{min-height:72px;font-size:26px;padding:8px 36px}
.btn[disabled]{opacity:.45}
.btn.on{background:#FFE6A0}
.panel{background:var(--paper);margin:3px;box-shadow:var(--edge),3px 3px 0 3px rgba(0,0,0,.28)}
/* top bar */
#top{flex:0 0 auto;height:64px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#1A2B47}
#hearts{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;background:var(--paper);margin:3px;box-shadow:var(--edge)}
#hearts img{width:27px;height:24px}#heartN{font:400 22px/1 var(--px);letter-spacing:1px}
#hearts.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.15)}}
.sp{flex:1}
.tbtn{width:56px;height:56px;min-height:56px;padding:0}
.tbtn.txt{width:auto;padding:0 10px;font-size:18px;white-space:nowrap}
.bars{display:grid;gap:5px;width:24px}.bars i{display:block;height:4px;background:var(--ink)}
/* stage */
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--navy);position:relative}
#vp{position:relative}
#scene{display:block;touch-action:none;image-rendering:pixelated;-webkit-user-select:none;user-select:none}
#bubbles,#hint,#caption{position:absolute;pointer-events:none}
#bubbles{inset:0}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);padding:6px 12px;font:700 18px/1.25 var(--font);text-align:center;max-width:86%;width:max-content;
  box-shadow:var(--edge),3px 3px 0 3px rgba(0,0,0,.2);animation:pop .22s steps(3)}
.bubble::after{content:"";position:absolute;left:calc(50% + var(--tail,0px) - 6px);bottom:-12px;width:12px;height:9px;background:var(--paper);
  box-shadow:-3px 0 0 var(--ink),3px 0 0 var(--ink),0 3px 0 var(--ink)}
@keyframes pop{from{transform:translate(-50%,-90%) scale(.8)}to{transform:translate(-50%,-100%) scale(1)}}
#hint{left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translate(-50%,0)}
#hint img{width:48px;animation:rub 1.1s ease-in-out infinite}
@keyframes rub{0%,100%{transform:translate(-14px,0)}50%{transform:translate(14px,-4px)}}
#caption{left:8px;right:8px;bottom:8px;background:var(--paper);padding:8px 12px;text-align:center;font-weight:700;box-shadow:var(--edge)}
#toybar{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px;background:rgba(26,43,71,.92);color:#fff;font-weight:700}
/* bottom bar */
#bottom{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:0;padding:8px 2px calc(10px + env(safe-area-inset-bottom));background:#1A2B47}
#bottom .btn{flex-direction:column;gap:2px;min-height:84px;margin:2px;padding:6px 0 6px;letter-spacing:-.02em;font-size:clamp(17px,4.8vw,20px);background:var(--paper);white-space:nowrap}
#bottom .btn img{height:30px;width:auto}
body.title #top,body.title #bottom{visibility:hidden}
/* overlays */
#scrim{position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:20}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,560px);max-height:78dvh;overflow:auto;z-index:21;background:var(--paper);padding:14px 12px calc(14px + env(safe-area-inset-bottom));
  transform:translate(-50%,100%);transition:transform .22s steps(5);box-shadow:0 -3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.sheet.open{transform:translate(-50%,0)}
.sheet h2{margin:2px 6px 10px;font:700 24px/1.2 var(--font);text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 3px 8px}
.grid.one{grid-template-columns:1fr}
.item{flex-direction:column;min-height:112px;gap:6px;background:var(--mint);font-size:20px;padding:10px 6px}
.item img{height:42px;width:auto}.item.sel{background:#FFE6A0}
.note{margin:2px 6px 10px;text-align:center;font-weight:700;background:#FFE6A0;padding:8px}
#title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#title .tTop{padding:calc(24px + env(safe-area-inset-top)) 16px 40px;text-align:center;color:var(--paper);background:linear-gradient(#22385Aee,#22385A00)}
#title h1{margin:0;font:700 44px/1.15 var(--font);text-shadow:3px 3px 0 var(--ink)}
#title p{margin:6px 0 0;font-size:22px;font-weight:700;text-shadow:2px 2px 0 var(--ink)}
#title .tBot{padding:20px 16px calc(28px + env(safe-area-inset-bottom));display:flex;justify-content:center;background:linear-gradient(#22385A00,#22385Add 50%);pointer-events:auto}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(15,25,45,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--paper);padding:22px 16px;width:min(100%,440px);text-align:center}
.card h2{margin:0 0 14px;font:700 28px/1.2 var(--font)}
.card input{width:calc(100% - 6px);margin:3px 3px 12px;height:60px;font:700 24px var(--font);text-align:center;border:0;background:#fff;color:var(--ink);box-shadow:var(--edge);-webkit-user-select:text;user-select:text}
#mem{position:fixed;inset:0;z-index:25;background:var(--navy);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#mem header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#1A2B47;color:#fff}
#mem header h2{margin:0;font:700 24px var(--font)}
#memTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px 8px;background:#1A2B47}
#memTabs .btn{min-height:60px;padding:4px 2px;font-size:20px;background:var(--paper);line-height:1.15}
#memTabs .btn.on{background:var(--som)}
#memBody{flex:1;overflow:auto;padding:14px;color:#fff}
#memBody .panel{color:var(--ink);padding:16px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;image-rendering:auto;background:#1A2B47}
.facts{margin:0;padding:0;list-style:none}.facts li{margin:8px 0}
.foot{margin-top:14px;text-align:center;font-weight:700;border-top:3px dashed var(--som-deep);padding-top:12px}
.kv{display:flex;align-items:center;gap:8px;justify-content:center}
.vhead{margin:4px 2px 8px;font:700 22px/1.2 var(--font);color:#fff}
.vrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.vitem{position:relative;flex:0 0 auto;width:108px;height:192px;background:#1A2B47;box-shadow:var(--edge)}
.vitem img.poster{width:100%;height:100%;object-fit:cover;image-rendering:auto;display:block}
.vitem .badge{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.vitem .dur{position:absolute;right:4px;bottom:4px;background:var(--paper);color:var(--ink);font:400 13px/1 var(--px);padding:4px 5px}
.photos button{padding:0;display:block;background:#1A2B47;min-height:0}
#viewer{position:fixed;inset:0;z-index:40;background:#0B1424;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#vmedia{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y;overflow:hidden}
#vmedia img,#vmedia video{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto;background:#000}
#vmedia img{pointer-events:auto}
#vcap{padding:10px 16px 4px;color:#fff;font:700 20px/1.35 var(--font);text-align:center;min-height:56px}
#vcount{color:#BFD0E8;font:400 13px var(--px);text-align:center;padding-bottom:4px}
#vbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;padding:4px 6px calc(10px + env(safe-area-inset-bottom))}
#vbtns .btn{min-width:0;padding:6px 4px}
.sky{position:relative;height:120px;margin:0 0 14px;background:linear-gradient(#0E1640,#26306E);box-shadow:var(--edge);overflow:hidden}
.sky i{position:absolute;width:3px;height:3px;background:#DCE6FF}
.sky img{position:absolute;left:50%;top:50%;width:60px;transform:translate(-50%,-50%);animation:tw 2.4s steps(2) infinite}
@keyframes tw{50%{opacity:.7}}
#msgIn{display:block;width:calc(100% - 6px);margin:3px;min-height:120px;padding:12px;font:500 20px/1.4 var(--font);color:var(--ink);background:#fff;border:0;box-shadow:var(--edge);resize:none;-webkit-user-select:text;user-select:text}
.letters{margin-top:16px;display:grid;gap:14px}
.letter .meta{font-weight:700;font-size:18px;color:var(--som-deep);margin-bottom:6px}
.letter .txt{white-space:pre-wrap;word-break:break-word;font-size:20px;line-height:1.45}
.letter .row{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.letter .row b{flex:1 1 100%}
#motd .card img{display:block;max-width:100%;max-height:46dvh;margin:0 auto 10px;object-fit:contain;image-rendering:auto;background:#000}
#motd .cap{font-weight:700;font-size:20px;margin:0 0 14px}
.dbg{position:fixed;left:4px;top:70px;z-index:99;font:11px monospace;color:#0f0;background:#000a;padding:2px 4px;pointer-events:none}
@media (prefers-reduced-motion:reduce){#hint img{animation:none}.bubble{animation:none}.sheet{transition:none}}
</style>
</head>
<body class="title">
<div id="app">
  <header id="top">
    <div id="hearts"><img id="heartIc" alt=""><span id="heartN">0</span></div>
    <div class="sp"></div>
    <button class="btn paper tbtn txt" id="btnScene">ไปสวน</button>
    <button class="btn paper tbtn" id="btnSound" aria-label="เสียง"></button>
    <button class="btn paper tbtn" id="btnMenu" aria-label="เมนู"><span class="bars"><i></i><i></i><i></i></span></button>
  </header>
  <main id="stage">
    <div id="vp">
      <canvas id="scene" aria-label="บ้านของส้ม"></canvas>
      <div id="bubbles"></div>
      <div id="hint" hidden><img id="handIc" alt=""></div>
      <div id="caption" hidden></div>
    </div>
    <div id="toybar" hidden><span id="toyLabel"></span><button class="btn paper" id="btnStow">เก็บของเล่น</button></div>
  </main>
  <nav id="bottom">
    <button class="btn" id="bTreat"><span class="icw"></span><span>ให้ขนม</span></button>
    <button class="btn" id="bPlay"><span class="icw"></span><span>เล่น</span></button>
    <button class="btn" id="bDress"><span class="icw"></span><span>แต่งตัว</span></button>
    <button class="btn" id="bMem"><span class="icw"></span><span>ความทรงจำ</span></button>
  </nav>
</div>

<section id="title">
  <div class="tTop"><h1>บ้านของส้ม</h1><p>ด้วยรักและคิดถึงเสมอ</p></div>
  <div class="tBot"><button class="btn big" id="btnEnter">เข้าบ้าน</button></div>
</section>

<section id="nameScr" class="overlay" hidden>
  <div class="card panel">
    <h2 id="nameQ">ใครมาหาส้มจ๊ะ?</h2>
    <div id="nameBtns"><button class="btn wide" data-n="พ่อ">พ่อ</button><button class="btn wide" data-n="แม่">แม่</button><button class="btn wide paper" id="nameOwn">พิมพ์ชื่อเอง</button></div>
    <div id="nameType" hidden><input id="nameIn" maxlength="12" autocomplete="off" placeholder="ชื่อของคุณ"><button class="btn wide teal" id="nameOk">ตกลง</button></div>
    <button class="btn wide paper" id="nameCancel" hidden>ยกเลิก</button>
  </div>
</section>

<section id="motd" class="overlay" hidden>
  <div class="card panel"><h2>ความทรงจำวันนี้</h2><img id="motdImg" alt=""><p class="cap" id="motdCap"></p>
    <button class="btn wide" id="motdAll">ดูรูปทั้งหมด</button><button class="btn wide paper" id="motdClose">ปิด</button></div>
</section>

<section id="viewer" hidden role="dialog" aria-modal="true">
  <div id="vmedia"></div><div id="vcap"></div><div id="vcount"></div>
  <div id="vbtns"><button class="btn paper" id="vPrev">ก่อนหน้า</button><button class="btn" id="vClose">ปิด</button><button class="btn paper" id="vNext">ถัดไป</button></div>
</section>

<div id="scrim" hidden></div>
<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
  <h2 id="sheetTitle"></h2><div id="sheetBody"></div>
  <button class="btn wide paper" id="sheetClose">ปิด</button>
</section>

<section id="mem" hidden>
  <header><h2>ความทรงจำ</h2><button class="btn paper" id="memClose">ปิด</button></header>
  <div id="memTabs"><button class="btn" data-tab="0">รูปส้ม</button><button class="btn" data-tab="1">ฝากถึงส้ม</button><button class="btn" data-tab="2">เกี่ยวกับส้ม</button></div>
  <div id="memBody"></div>
</section>

<script src="photos.js"></script>
<script src="videos.js"></script>
<script src="js/state.js"></script>
<script src="js/sprites.js"></script>
<script src="js/icons.js"></script>
<script src="js/room.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/cat.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
